<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Bitácora de Obra</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --ink:#1C1F26;
    --steel:#3D5A80;
    --safety:#FF6A13;
    --paper:#F3F1EA;
    --card:#FFFFFF;
    --line:#DEDAD0;
    --ok:#2E7D32;
    --bad:#C0392B;
    --new:#B8860B;
    --muted:#767267;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Inter',system-ui,-apple-system,sans-serif;
    background:var(--paper); color:var(--ink);
    padding-bottom:76px;
    touch-action: manipulation;
  }
  button, .toggle, .del, input, select, .tabbar button{
    touch-action: manipulation;
  }
  h1,h2,h3,.disp{ font-family:'Barlow Condensed', system-ui, sans-serif; font-weight:700; letter-spacing:.2px;}
  header{
    background:var(--ink); color:#fff; padding:14px 16px 12px;
    position:sticky; top:0; z-index:20;
  }
  header .row{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  header h1{font-size:22px; margin:0; line-height:1;}
  header input[type=date]{
    background:transparent; border:1px solid #555; color:#fff; border-radius:6px;
    padding:5px 6px; font-family:inherit; font-size:16px; max-width:118px;
  }
  header .btn.ghost{ background:transparent; color:#fff; border:1px solid #666; }
  .sub{font-size:12px; color:#B9B6AC; margin-top:4px;}
  main{padding:14px; max-width:760px; margin:0 auto;}
  .tabbar{
    position:fixed; bottom:0; left:0; right:0; background:var(--ink);
    display:flex; z-index:30; border-top:2px solid var(--safety);
  }
  .tabbar button{
    flex:1; background:none; border:none; color:#9A968B; padding:10px 2px 8px;
    font-family:inherit; font-size:11px; cursor:pointer;
  }
  .tabbar button.active{color:#fff;}
  .tabbar button .ic{display:block; font-size:18px; margin-bottom:2px;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:14px; margin-bottom:12px;
  }
  .card h3{margin:0 0 10px; font-size:19px;}
  .btn{
    background:var(--safety); color:#fff; border:none; border-radius:7px;
    padding:9px 14px; font-weight:600; font-size:13.5px; cursor:pointer; font-family:inherit;
  }
  .btn.secondary{background:var(--steel);}
  .btn.ghost{background:transparent; color:var(--steel); border:1px solid var(--steel);}
  .btn.small{padding:6px 10px; font-size:12px;}
  .btn.danger{background:var(--bad);}
  .btn:disabled{opacity:.5;}
  .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .worker{
    border:1px solid var(--line); border-radius:9px; padding:10px; margin-bottom:9px;
  }
  .worker.absent{opacity:.55; background:#FAFAF7;}
  .worker-top{display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .worker-name{font-weight:700; font-size:15.5px; display:flex; align-items:center; gap:6px;}
  .badge{font-size:10.5px; padding:2px 7px; border-radius:20px; font-weight:700;}
  .badge.new{background:#FCEDCB; color:var(--new);}
  .badge.absent{background:#F6DCD9; color:var(--bad);}
  .badge.ot{background:#E4EEF9; color:var(--steel);}
  .times{display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-top:8px;}
  .times label{font-size:10.5px; color:var(--muted); display:block; margin-bottom:2px;}
  input[type=time], input[type=text], select, textarea{
    width:100%; border:1px solid var(--line); border-radius:6px; padding:7px 8px;
    font-size:16px; font-family:inherit; background:#fff;
  }
  .name-input{border:none; background:transparent; font-weight:700; font-size:16px; padding:0; width:auto; flex:1;}
  .toggle{border:1px solid var(--line); border-radius:6px; padding:5px 8px; font-size:11.5px; cursor:pointer; background:#fff;}
  .toggle.on{background:var(--ink); color:#fff; border-color:var(--ink);}
  .toggle.lunch-off{background:var(--safety); color:#fff; border-color:var(--safety);}
  .badge.lunch{background:#FCEDCB; color:var(--new);}
  .act-item{
    display:flex; gap:8px; align-items:flex-start; padding:8px 0; border-bottom:1px solid var(--line);
  }
  .act-item:last-child{border-bottom:none;}
  .act-time{font-weight:700; color:var(--steel); font-size:13px; min-width:46px;}
  .act-text{flex:1; font-size:14px;}
  .act-worker{font-size:11.5px; color:var(--muted);}
  .del{background:none; border:none; color:var(--bad); font-size:16px; cursor:pointer; padding:0 4px;}
  .empty{color:var(--muted); font-size:13.5px; padding:6px 0;}
  #recDot{display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--bad); margin-right:6px; animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  #transcript{min-height:70px; margin-bottom:10px;}
  .field{margin-bottom:9px;}
  .field label{font-size:11.5px; color:var(--muted); display:block; margin-bottom:3px;}
  pre.report{
    white-space:pre-wrap; font-family:inherit; font-size:13.5px; background:#FAFAF7;
    border:1px dashed var(--line); border-radius:8px; padding:12px; line-height:1.5;
  }
  .chartwrap{background:#fff; border-radius:8px; padding:8px;}
  .summary3{display:flex; gap:8px;}
  .summary3 .box{flex:1; text-align:center; background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px 4px;}
  .summary3 .num{font-family:'Barlow Condensed'; font-size:26px; font-weight:700;}
  .summary3 .lbl{font-size:10.5px; color:var(--muted);}
  .toast{
    position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff;
    padding:9px 16px; border-radius:20px; font-size:13px; z-index:50; opacity:0; transition:opacity .25s;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>

<header>
  <div class="row">
    <h1>🏗️ Bitácora de Obra</h1>
    <div class="row" style="gap:6px;">
      <button class="btn ghost small" id="prevDay" style="padding:6px 10px;">◀</button>
      <input type="date" id="datePicker">
      <button class="btn ghost small" id="nextDay" style="padding:6px 10px;">▶</button>
    </div>
  </div>
  <div class="sub" id="headerSub">Cargando...</div>
</header>

<main id="app"></main>

<div class="tabbar">
  <button data-tab="hoy" class="active"><span class="ic">📋</span>Hoy</button>
  <button data-tab="trabajadores"><span class="ic">👷</span>Personal</button>
  <button data-tab="semana"><span class="ic">📊</span>Semana</button>
  <button data-tab="audio"><span class="ic">🎙️</span>Audio</button>
  <button data-tab="reporte"><span class="ic">📝</span>Reporte</button>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getFirestore, collection, doc, getDoc, getDocs, setDoc, deleteDoc
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

/* =========================================================
   ⚠️ PEGA AQUÍ TU CONFIGURACIÓN DE FIREBASE ⚠️
   La encuentras en: Firebase Console → Configuración del
   proyecto → Tus apps → "Config" (o "SDK setup and config").
   Puedes usar el mismo proyecto que CaparaDos/Flows o uno nuevo.
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyAbzvkJY9ik3lklVXJGoWBtBn9_f7SaS8I",
  authDomain: "control-obra-a0496.firebaseapp.com",
  projectId: "control-obra-a0496",
  storageBucket: "control-obra-a0496.firebasestorage.app",
  messagingSenderId: "336205273799",
  appId: "1:336205273799:web:307236773fb332700fbce2"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const pad = n => String(n).padStart(2,'0');
const todayISO = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const nowHM = () => { const d=new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const DIAS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];

let state = {
  tab: 'hoy',
  date: todayISO(),
  workers: [],       // {id, name}
  projects: [],      // {id, name}
  log: { workers:{}, activities:[] } // workers[id] = {present, tookLunch, entrada, salida, salidaReal, projectId}
};

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

function uid(){ return 'w'+Math.random().toString(36).slice(2,9); }

async function loadWorkers(){
  try{
    const snap = await getDocs(collection(db,'workers'));
    state.workers = snap.docs
      .map(d=>({id:d.id, ...d.data()}))
      .sort((a,b)=>(a.order||0)-(b.order||0));
  }catch(e){
    console.error(e);
    toast('No se pudo conectar con Firebase. Revisa la configuración.');
    state.workers = [];
  }
}
async function addWorkerDoc(worker){
  await setDoc(doc(db,'workers',worker.id), { name: worker.name, order: Date.now() });
}
async function updateWorkerDoc(worker){
  await setDoc(doc(db,'workers',worker.id), { name: worker.name }, { merge:true });
}
async function deleteWorkerDoc(id){
  await deleteDoc(doc(db,'workers',id));
}
async function loadProjects(){
  try{
    const snap = await getDocs(collection(db,'projects'));
    state.projects = snap.docs
      .map(d=>({id:d.id, ...d.data()}))
      .sort((a,b)=>(a.order||0)-(b.order||0));
  }catch(e){
    console.error(e);
    toast('No se pudo cargar la lista de proyectos.');
    state.projects = [];
  }
}
async function addProjectDoc(project){
  await setDoc(doc(db,'projects',project.id), { name: project.name, order: Date.now() });
}
async function updateProjectDoc(project){
  await setDoc(doc(db,'projects',project.id), { name: project.name }, { merge:true });
}
async function deleteProjectDoc(id){
  await deleteDoc(doc(db,'projects',id));
}
async function loadLog(date){
  try{
    const snap = await getDoc(doc(db,'logs',date));
    state.log = snap.exists() ? snap.data() : { workers:{}, activities:[] };
  }catch(e){
    console.error(e);
    toast('No se pudo cargar el registro del día.');
    state.log = { workers:{}, activities:[] };
  }
  // Si un trabajador se agregó después de esta fecha, no lo marcamos
  // presente por defecto: eso falsearía el historial de asistencia.
  state.workers.forEach(w=>{
    if(!state.log.workers[w.id]) state.log.workers[w.id] = { present:false, tookLunch:true, entrada:'', salida:'', salidaReal:'', projectId:'' };
  });
}
async function saveLog(){
  try{
    await setDoc(doc(db,'logs',state.date), state.log);
    saveWeekSummary(); // en segundo plano, no bloquea la UI
  }catch(e){
    console.error(e);
    toast('No se pudo guardar. Revisa tu conexión o la configuración de Firebase.');
  }
}
async function computeWeekTotals(monday){
  const labels=[], horas=[], extra=[], presentes=[];
  for(let i=0;i<7;i++){
    const d = new Date(monday); d.setDate(monday.getDate()+i);
    const iso = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    labels.push(DIAS[d.getDay()].slice(0,3));
    let hSum=0, eSum=0, pCount=0;
    try{
      const snap = await getDoc(doc(db,'logs',iso));
      if(snap.exists()){
        const log = snap.data();
        Object.values(log.workers||{}).forEach(l=>{
          if(l.present){
            pCount++;
            hSum += workedHours(l.entrada, l.salida);
            eSum += totalOvertime(l);
          }
        });
      }
    }catch(e){}
    horas.push(+hSum.toFixed(2)); extra.push(+eSum.toFixed(2)); presentes.push(pCount);
  }
  return { labels, horas, extra, presentes, updatedAt: Date.now() };
}
async function saveWeekSummary(){
  const monday = mondayOf(state.date);
  const mondayISO = `${monday.getFullYear()}-${pad(monday.getMonth()+1)}-${pad(monday.getDate())}`;
  try{
    const totals = await computeWeekTotals(monday);
    await setDoc(doc(db,'weeks',mondayISO), totals);
  }catch(e){ console.error(e); }
}

const LUNCH_HOURS = 1; // hora de almuerzo estándar; si no se toma, se suma como extra

function overtimeHours(salida, real){
  if(!salida || !real) return 0;
  const [h1,m1] = salida.split(':').map(Number);
  const [h2,m2] = real.split(':').map(Number);
  const diff = (h2*60+m2) - (h1*60+m1);
  return diff > 0 ? +(diff/60).toFixed(2) : 0;
}
function totalOvertime(l){
  const base = overtimeHours(l.salida, l.salidaReal);
  const lunch = l.tookLunch === false ? LUNCH_HOURS : 0;
  return +(base + lunch).toFixed(2);
}
function workedHours(entrada, salida){
  if(!entrada || !salida) return 0;
  const [h1,m1] = entrada.split(':').map(Number);
  const [h2,m2] = salida.split(':').map(Number);
  let diff = (h2*60+m2) - (h1*60+m1);
  if(diff < 0) diff += 24*60;
  return +(diff/60).toFixed(2);
}

function setHeaderSub(){
  const d = new Date(state.date+'T00:00:00');
  const dia = DIAS[d.getDay()];
  const presentes = state.workers.filter(w=>state.log.workers[w.id]?.present).length;
  $('#headerSub').textContent = `${dia} · ${state.workers.length} en planilla · ${presentes} presentes`;
}

/* ---------------- RENDER: HOY ---------------- */
function renderHoy(){
  const w = state.workers;
  let html = `
  <div class="card">
    <h3>Acciones rápidas</h3>
    <div class="row">
      <button class="btn" id="btnNormal">Horario normal a todos (7:00–16:00)</button>
      <button class="btn ghost" id="btnBulkOpen">Aplicar hora a todos...</button>
    </div>
    <div id="bulkPanel" style="display:none; margin-top:10px;">
      <div class="row">
        <select id="bulkField" style="width:auto;">
          <option value="entrada">Entrada</option>
          <option value="salida">Salida</option>
          <option value="salidaReal">Salida real (extra)</option>
        </select>
        <input type="time" id="bulkTime" style="width:auto;">
        <button class="btn small secondary" id="bulkApply">Aplicar</button>
      </div>
    </div>
  </div>`;

  if(w.length===0){
    html += `<div class="card"><p class="empty">No hay trabajadores registrados. Ve a la pestaña <b>Personal</b> para agregarlos.</p></div>`;
  } else {
    html += `<div class="card"><h3>Asistencia y horas</h3>`;
    w.forEach(worker=>{
      const l = state.log.workers[worker.id] || {present:true,tookLunch:true,entrada:'',salida:'',salidaReal:''};
      const tookLunch = l.tookLunch !== false; // sin dato guardado = sí almorzó
      const ot = totalOvertime(l);
      html += `
      <div class="worker ${l.present?'':'absent'}" data-id="${worker.id}">
        <div class="worker-top">
          <div class="worker-name">
            ${worker.name}
            ${!l.present ? '<span class="badge absent">Ausente</span>' : ''}
            ${ot>0 ? `<span class="badge ot">+${ot}h extra</span>` : ''}
          </div>
          <div class="row">
            <span class="toggle ${l.present?'on':''}" data-act="present">${l.present?'Presente':'Ausente'}</span>
            <span class="toggle ${tookLunch?'':'lunch-off'}" data-act="lunch">${tookLunch?'Almorzó':'No almorzó'}</span>
          </div>
        </div>
        ${l.present ? `
        <div class="times">
          <div><label>Entrada</label><input type="time" data-f="entrada" value="${l.entrada}"></div>
          <div><label>Salida</label><input type="time" data-f="salida" value="${l.salida}"></div>
          <div><label>Salida real</label><input type="time" data-f="salidaReal" value="${l.salidaReal}"></div>
        </div>
        <div style="margin-top:6px;">
          <label style="font-size:10.5px; color:var(--muted); display:block; margin-bottom:2px;">Proyecto</label>
          <select data-f="projectId">
            <option value="">Sin proyecto asignado</option>
            ${state.projects.map(p=>`<option value="${p.id}" ${l.projectId===p.id?'selected':''}>${p.name}</option>`).join('')}
          </select>
        </div>` : ''}
      </div>`;
    });
    html += `</div>`;
  }

  html += `<div class="card">
    <h3>Actividades del día</h3>
    <div class="row" style="margin-bottom:10px;">
      <input type="time" id="newActTime" value="${nowHM()}" style="width:auto;">
      <select id="newActWorker" style="width:auto; max-width:150px;">
        <option value="">General / supervisión</option>
        ${w.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}
      </select>
      <select id="newActProject" style="width:auto; max-width:150px;">
        <option value="">Sin proyecto</option>
        ${state.projects.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}
      </select>
    </div>
    <div class="row" style="margin-bottom:10px;">
      <input type="text" id="newActText" placeholder="¿Qué se está haciendo o supervisando?" style="flex:1; min-width:180px;">
      <button class="btn small" id="addActBtn">Agregar</button>
    </div>
    <div id="actList">
      ${state.log.activities.length ? state.log.activities.map((a,i)=>`
        <div class="act-item">
          <div class="act-time">${a.time}</div>
          <div class="act-text">${a.text}${(a.workerName||a.projectName)?`<div class="act-worker">${[a.workerName,a.projectName].filter(Boolean).join(' · ')}</div>`:''}</div>
          <button class="del" data-i="${i}">✕</button>
        </div>`).join('') : '<p class="empty">Sin actividades registradas todavía.</p>'}
    </div>
  </div>`;

  $('#app').innerHTML = html;

  $('#btnNormal').onclick = async ()=>{
    state.workers.forEach(x=>{
      const l = state.log.workers[x.id];
      if(l && l.present){ l.entrada='07:00'; l.salida='16:00'; }
    });
    await saveLog(); renderHoy(); setHeaderSub(); toast('Horario normal aplicado');
  };
  $('#btnBulkOpen').onclick = ()=>{ $('#bulkPanel').style.display = $('#bulkPanel').style.display==='none'?'block':'none'; };
  $('#bulkApply')?.addEventListener('click', async ()=>{
    const f = $('#bulkField').value, v = $('#bulkTime').value;
    if(!v){ toast('Elige una hora'); return; }
    state.workers.forEach(x=>{
      const l = state.log.workers[x.id];
      if(l && l.present) l[f] = v;
    });
    await saveLog(); renderHoy(); toast('Hora aplicada a todos los presentes');
  });

  $$('.worker').forEach(card=>{
    const id = card.dataset.id;
    const l = state.log.workers[id];
    card.querySelectorAll('.toggle').forEach(tg=>{
      tg.onclick = async ()=>{
        if(tg.dataset.act==='present'){ l.present = !l.present; if(!l.present){l.entrada='';l.salida='';l.salidaReal='';} }
        if(tg.dataset.act==='lunch') l.tookLunch = (l.tookLunch === false); // alterna: false->true, true/undefined->false
        await saveLog(); renderHoy(); setHeaderSub();
      };
    });
    card.querySelectorAll('input[type=time]').forEach(inp=>{
      // OJO: no llamamos renderHoy() aquí — reconstruir la tarjeta mientras
      // el selector nativo de hora está abierto lo cierra de golpe en iOS.
      // Solo guardamos y actualizamos el badge de horas extra en el lugar.
      inp.onchange = async ()=>{
        l[inp.dataset.f] = inp.value;
        await saveLog();
        const ot = totalOvertime(l);
        let otBadge = card.querySelector('.badge.ot');
        if(ot > 0){
          if(!otBadge){
            otBadge = document.createElement('span');
            otBadge.className = 'badge ot';
            card.querySelector('.worker-name').appendChild(otBadge);
          }
          otBadge.textContent = `+${ot}h extra`;
        } else if(otBadge){
          otBadge.remove();
        }
      };
    });
    card.querySelector('select[data-f="projectId"]')?.addEventListener('change', async (e)=>{
      l.projectId = e.target.value;
      await saveLog();
    });
  });

  $('#addActBtn').onclick = async ()=>{
    const text = $('#newActText').value.trim();
    if(!text){ toast('Escribe la actividad'); return; }
    const time = $('#newActTime').value || nowHM();
    const wid = $('#newActWorker').value;
    const workerName = wid ? state.workers.find(x=>x.id===wid)?.name : '';
    const pid = $('#newActProject').value;
    const projectName = pid ? state.projects.find(x=>x.id===pid)?.name : '';
    state.log.activities.push({time, text, workerId:wid||null, workerName, projectId:pid||null, projectName});
    state.log.activities.sort((a,b)=>a.time.localeCompare(b.time));
    await saveLog(); renderHoy(); toast('Actividad agregada');
  };
  $$('#actList .del').forEach(b=>{
    b.onclick = async ()=>{
      state.log.activities.splice(+b.dataset.i,1);
      await saveLog(); renderHoy();
    };
  });
}

/* ---------------- RENDER: TRABAJADORES ---------------- */
function renderTrabajadores(){
  let html = `
  <div class="card">
    <h3>Proyectos</h3>
    <div class="row" style="margin-bottom:10px;">
      <input type="text" id="newProjectName" placeholder="Nombre del proyecto (ej. ALTEZZA)" style="flex:1; min-width:160px;">
      <button class="btn secondary" id="addProjectBtn">Agregar</button>
    </div>
    ${state.projects.length===0 ? '<p class="empty">Aún no hay proyectos. Sin proyectos, la app funciona igual, solo que sin ese filtro.</p>' : ''}
    ${state.projects.map(p=>`
      <div class="worker">
        <div class="worker-top">
          <input class="name-input" data-pid="${p.id}" value="${p.name}">
          <button class="del" data-delp="${p.id}">✕</button>
        </div>
      </div>`).join('')}
  </div>
  <div class="card">
    <h3>Agregar trabajador</h3>
    <div class="row">
      <input type="text" id="newWorkerName" placeholder="Nombre completo" style="flex:1; min-width:160px;">
      <button class="btn" id="addWorkerBtn">Agregar</button>
    </div>
  </div>
  <div class="card"><h3>Planilla (${state.workers.length})</h3>`;
  if(state.workers.length===0){ html += '<p class="empty">Aún no hay trabajadores.</p>'; }
  state.workers.forEach(w=>{
    html += `
    <div class="worker">
      <div class="worker-top">
        <input class="name-input" data-id="${w.id}" value="${w.name}">
        <button class="del" data-del="${w.id}">✕</button>
      </div>
    </div>`;
  });
  html += `</div>`;
  $('#app').innerHTML = html;

  $('#addProjectBtn').onclick = async ()=>{
    const name = $('#newProjectName').value.trim();
    if(!name){ toast('Escribe un nombre de proyecto'); return; }
    const id = uid();
    try{
      await addProjectDoc({id, name});
      state.projects.push({id, name});
      renderTrabajadores(); toast('Proyecto agregado');
    }catch(e){
      console.error(e);
      toast('No se pudo guardar el proyecto. Revisa la configuración.');
    }
  };
  $$('[data-pid]').forEach(inp=>{
    inp.onchange = async ()=>{
      const p = state.projects.find(x=>x.id===inp.dataset.pid);
      const newName = inp.value.trim() || p.name;
      try{
        await updateProjectDoc({id:p.id, name:newName});
        p.name = newName;
        toast('Proyecto actualizado');
      }catch(e){
        console.error(e);
        toast('No se pudo actualizar el proyecto.');
      }
    };
  });
  $$('[data-delp]').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('¿Eliminar este proyecto? Los días ya guardados conservarán el nombre pero perderán el enlace al proyecto.')) return;
      try{
        await deleteProjectDoc(b.dataset.delp);
        state.projects = state.projects.filter(x=>x.id!==b.dataset.delp);
        renderTrabajadores();
      }catch(e){
        console.error(e);
        toast('No se pudo eliminar el proyecto.');
      }
    };
  });
  $('#addWorkerBtn').onclick = async ()=>{
    const name = $('#newWorkerName').value.trim();
    if(!name){ toast('Escribe un nombre'); return; }
    const id = uid();
    const worker = {id, name};
    try{
      await addWorkerDoc(worker);
      state.workers.push(worker);
      state.log.workers[id] = {present:true, tookLunch:true, entrada:'', salida:'', salidaReal:''};
      await saveLog();
      renderTrabajadores(); setHeaderSub(); toast('Trabajador agregado');
    }catch(e){
      console.error(e);
      toast('No se pudo guardar en Firebase. Revisa la configuración.');
    }
  };
  $$('.name-input[data-id]').forEach(inp=>{
    inp.onchange = async ()=>{
      const w = state.workers.find(x=>x.id===inp.dataset.id);
      const newName = inp.value.trim() || w.name;
      try{
        await updateWorkerDoc({id:w.id, name:newName});
        w.name = newName;
        toast('Nombre actualizado');
      }catch(e){
        console.error(e);
        toast('No se pudo actualizar. Revisa tu conexión.');
      }
    };
  });
  $$('[data-del]').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('¿Eliminar este trabajador de la planilla?')) return;
      try{
        await deleteWorkerDoc(b.dataset.del);
        state.workers = state.workers.filter(x=>x.id!==b.dataset.del);
        delete state.log.workers[b.dataset.del];
        await saveLog();
        renderTrabajadores(); setHeaderSub();
      }catch(e){
        console.error(e);
        toast('No se pudo eliminar. Revisa tu conexión.');
      }
    };
  });
}

/* ---------------- RENDER: SEMANA ---------------- */
function mondayOf(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const day = d.getDay();
  const diff = (day===0? -6 : 1-day);
  d.setDate(d.getDate()+diff);
  return d;
}
async function renderSemana(){
  $('#app').innerHTML = `<div class="card"><h3>Resumen semanal</h3><div class="chartwrap"><canvas id="weekChart" height="220"></canvas></div></div>
  <div class="card" id="weekTotals"></div>`;

  const monday = mondayOf(state.date);
  const mondayISO = `${monday.getFullYear()}-${pad(monday.getMonth()+1)}-${pad(monday.getDate())}`;
  let totals;
  try{
    const snap = await getDoc(doc(db,'weeks',mondayISO));
    totals = snap.exists() ? snap.data() : await computeWeekTotals(monday);
  }catch(e){
    console.error(e);
    toast('No se pudo cargar el resumen semanal.');
    totals = { labels:[], horas:[], extra:[], presentes:[] };
  }
  const { labels, horas, extra, presentes } = totals;

  new Chart($('#weekChart'), {
    type:'bar',
    data:{ labels, datasets:[
      {label:'Horas normales', data:horas, backgroundColor:'#3D5A80'},
      {label:'Horas extra', data:extra, backgroundColor:'#FF6A13'}
    ]},
    options:{
      responsive:true,
      plugins:{ legend:{position:'bottom', labels:{font:{size:11}}} },
      scales:{ x:{stacked:true}, y:{stacked:true, title:{display:true,text:'horas'}} }
    }
  });

  const totalH = horas.reduce((a,b)=>a+b,0).toFixed(1);
  const totalE = extra.reduce((a,b)=>a+b,0).toFixed(1);
  const promP = (presentes.reduce((a,b)=>a+b,0)/7).toFixed(1);
  $('#weekTotals').innerHTML = `
    <h3>Totales de la semana</h3>
    <div class="summary3">
      <div class="box"><div class="num">${totalH}</div><div class="lbl">horas normales</div></div>
      <div class="box"><div class="num">${totalE}</div><div class="lbl">horas extra</div></div>
      <div class="box"><div class="num">${promP}</div><div class="lbl">promedio presentes/día</div></div>
    </div>`;
}

/* ---------------- RENDER: AUDIO ---------------- */
let recognizer = null, isRecording = false;
function renderAudio(){
  const supported = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
  $('#app').innerHTML = `
  <div class="card">
    <h3>Registrar por audio</h3>
    ${supported ? `
    <p class="empty" style="margin-top:-4px;">Graba una nota de voz rápida (ej: "a las 9 y media Don Mario terminó el cielo falso del nivel 3"). Se transcribe y se extraen los datos para que solo los revises.</p>
    <div class="row" style="margin:10px 0;">
      <button class="btn" id="recBtn">🎙️ Grabar</button>
      <span id="recStatus" style="font-size:13px; color:var(--muted);"></span>
    </div>
    <div class="field">
      <label>Transcripción</label>
      <textarea id="transcript" placeholder="Aquí aparecerá el texto reconocido..."></textarea>
    </div>
    <button class="btn secondary" id="extractBtn">Extraer datos con IA</button>
    <div id="extractResult"></div>
    ` : `<p class="empty">Este navegador no soporta reconocimiento de voz en tiempo real (funciona mejor en Chrome/Android). Puedes escribir la nota manualmente abajo.</p>
    <div class="field"><label>Nota</label><textarea id="transcript"></textarea></div>
    <button class="btn secondary" id="extractBtn">Extraer datos con IA</button>
    <div id="extractResult"></div>`}
  </div>`;

  if(supported){
    // iOS Safari tiene un bug conocido con continuous:true (el micrófono nunca
    // entrega el resultado final). Por eso usamos sesiones cortas que se
    // reinician solas mientras el usuario sigue grabando ("chaining").
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    let finalText = '';
    let stoppedByUser = false;

    function startSession(){
      recognizer = new SR();
      recognizer.lang = 'es-GT';
      recognizer.continuous = false;   // clave para que funcione en iOS
      recognizer.interimResults = true;

      recognizer.onresult = (e)=>{
        let interim = '';
        for(let i=e.resultIndex;i<e.results.length;i++){
          if(e.results[i].isFinal) finalText += e.results[i][0].transcript + ' ';
          else interim += e.results[i][0].transcript;
        }
        $('#transcript').value = (finalText + interim).trim();
      };

      recognizer.onerror = (e)=>{
        // "no-speech" es normal (silencio breve entre frases); no detenemos por eso.
        if(e.error !== 'no-speech'){
          stoppedByUser = true;
          isRecording = false;
          $('#recBtn').innerHTML = '🎙️ Grabar';
          $('#recStatus').textContent = 'Error de micrófono: ' + e.error;
        }
      };

      recognizer.onend = ()=>{
        if(!stoppedByUser && isRecording){
          // la sesión cortó sola (típico en iOS a los ~60s o tras una pausa):
          // reiniciamos automáticamente para que se sienta como grabación continua.
          startSession();
        } else {
          isRecording = false;
          $('#recBtn').innerHTML = '🎙️ Grabar';
          $('#recStatus').innerHTML = '';
        }
      };

      recognizer.start();
    }

    $('#recBtn').onclick = ()=>{
      if(isRecording){
        stoppedByUser = true;
        recognizer.stop();
        return;
      }
      stoppedByUser = false;
      finalText = $('#transcript').value ? $('#transcript').value.trim() + ' ' : '';
      isRecording = true;
      $('#recBtn').innerHTML = '⏹️ Detener';
      $('#recStatus').innerHTML = '<span id="recDot"></span>Escuchando...';
      startSession();
    };
  }

  $('#extractBtn').onclick = async ()=>{
    const text = $('#transcript').value.trim();
    if(!text){ toast('No hay texto para procesar'); return; }
    $('#extractResult').innerHTML = '<p class="empty">Procesando...</p>';
    try{
      const workerNames = state.workers.map(w=>w.name).join(', ') || 'ninguno registrado aún';
      const resp = await fetch('https://api.anthropic.com/v1/messages', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          model:'claude-sonnet-4-6',
          max_tokens:1000,
          messages:[{role:'user', content:
            `Extrae de esta nota de voz de supervisión de obra: actividad realizada/supervisada, hora mencionada (formato HH:MM 24h, si no se menciona usa null), y el nombre del trabajador si se menciona (compáralo con esta lista de trabajadores: ${workerNames}; si no coincide con ninguno, usa null).
Nota: "${text}"
Responde SOLO con JSON, sin texto adicional, sin backticks, con este formato exacto:
{"actividad":"...", "hora":"HH:MM o null", "trabajador":"nombre exacto de la lista o null"}`
          }]
        })
      });
      const data = await resp.json();
      const raw = data.content.map(c=>c.text||'').join('').replace(/```json|```/g,'').trim();
      const parsed = JSON.parse(raw);
      const matchedWorker = state.workers.find(w=>w.name===parsed.trabajador);
      const suggestedProject = matchedWorker ? state.log.workers[matchedWorker.id]?.projectId : '';
      $('#extractResult').innerHTML = `
        <div class="card" style="background:#FAFAF7; margin-top:10px;">
          <div class="field"><label>Actividad</label><input type="text" id="exActividad" value="${(parsed.actividad||'').replace(/"/g,'&quot;')}"></div>
          <div class="row">
            <div class="field" style="flex:1;"><label>Hora</label><input type="time" id="exHora" value="${parsed.hora && parsed.hora!=='null' ? parsed.hora : nowHM()}"></div>
            <div class="field" style="flex:1;"><label>Trabajador</label>
              <select id="exWorker">
                <option value="">General / supervisión</option>
                ${state.workers.map(w=>`<option value="${w.id}" ${matchedWorker&&matchedWorker.id===w.id?'selected':''}>${w.name}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="field"><label>Proyecto</label>
            <select id="exProject">
              <option value="">Sin proyecto</option>
              ${state.projects.map(p=>`<option value="${p.id}" ${suggestedProject===p.id?'selected':''}>${p.name}</option>`).join('')}
            </select>
          </div>
          <button class="btn small" id="confirmAddBtn">Agregar a la bitácora de hoy</button>
        </div>`;
      $('#confirmAddBtn').onclick = async ()=>{
        const wid = $('#exWorker').value;
        const workerName = wid ? state.workers.find(x=>x.id===wid)?.name : '';
        const pid = $('#exProject').value;
        const projectName = pid ? state.projects.find(x=>x.id===pid)?.name : '';
        state.log.activities.push({ time: $('#exHora').value, text: $('#exActividad').value, workerId: wid||null, workerName, projectId: pid||null, projectName });
        state.log.activities.sort((a,b)=>a.time.localeCompare(b.time));
        await saveLog();
        $('#transcript').value=''; $('#extractResult').innerHTML='';
        toast('Agregado a la bitácora de hoy');
      };
    }catch(e){
      $('#extractResult').innerHTML = '<p class="empty">No se pudo procesar el audio. Intenta de nuevo o agrégalo manualmente en la pestaña Hoy.</p>';
    }
  };
}

/* ---------------- RENDER: REPORTE ---------------- */
function buildReportText(projectId){
  const d = new Date(state.date+'T00:00:00');
  const fecha = `${d.getDate()} de ${['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'][d.getMonth()]} ${d.getFullYear()}`;
  const projLabel = projectId ? (state.projects.find(p=>p.id===projectId)?.name || '') : null;
  let t = `*📋 Reporte de obra – ${DIAS[d.getDay()]} ${fecha}*`;
  if(projLabel) t += `\n*Proyecto: ${projLabel}*`;
  t += `\n\n`;

  const relevantWorkers = state.workers.filter(w=>{
    if(!projectId) return true;
    const l = state.log.workers[w.id] || {};
    return l.projectId === projectId;
  });

  t += `*Asistencia:*\n`;
  if(relevantWorkers.length===0) t += `_Sin personal ${projectId?'asignado a este proyecto':'registrado'}_\n`;
  relevantWorkers.forEach(w=>{
    const l = state.log.workers[w.id] || {};
    const ot = totalOvertime(l);
    if(l.present){
      let line = `✅ ${w.name}`;
      if(l.entrada || l.salida) line += ` — ${l.entrada||'--:--'} a ${l.salida||'--:--'}`;
      if(l.salidaReal) line += ` (salió ${l.salidaReal})`;
      if(l.tookLunch === false) line += ` _(sin almuerzo)_`;
      if(ot>0) line += ` *(+${ot}h extra)*`;
      t += line + `\n`;
    } else {
      t += `❌ ${w.name} — ausente\n`;
    }
  });

  const relevantActs = state.log.activities.filter(a=> !projectId || a.projectId===projectId);
  t += `\n*Actividades del día:*\n`;
  if(relevantActs.length===0) t += `_Sin actividades registradas_\n`;
  relevantActs.forEach(a=>{
    let line = `• ${a.time} — ${a.text}`;
    const tag = [a.workerName, !projectId ? a.projectName : null].filter(Boolean).join(' · ');
    if(tag) line += ` _(${tag})_`;
    t += line + `\n`;
  });

  if(projectId){
    const totalOT = relevantWorkers.reduce((s,w)=> s + totalOvertime(state.log.workers[w.id]||{}), 0);
    t += `\n*Total horas extra del proyecto:* ${totalOT.toFixed(2)}h`;
  } else {
    // Desglose de horas extra por proyecto + total general
    const byProject = {};
    state.workers.forEach(w=>{
      const l = state.log.workers[w.id]||{};
      const ot = totalOvertime(l);
      if(ot<=0) return;
      const key = l.projectId || '_sin';
      byProject[key] = (byProject[key]||0) + ot;
    });
    const keys = Object.keys(byProject);
    if(keys.length){
      t += `\n*Horas extra por proyecto:*\n`;
      keys.forEach(key=>{
        const name = key==='_sin' ? 'Sin proyecto asignado' : (state.projects.find(p=>p.id===key)?.name || 'Proyecto eliminado');
        t += `• ${name}: ${byProject[key].toFixed(2)}h\n`;
      });
    }
    const totalOT = Object.values(byProject).reduce((a,b)=>a+b,0);
    t += `\n*Total horas extra del día:* ${totalOT.toFixed(2)}h`;
  }
  return t;
}
function renderReporte(){
  const projectId = $('#reportProject')?.value || '';
  const text = buildReportText(projectId);
  $('#app').innerHTML = `
  <div class="card">
    <h3>Reporte (formato WhatsApp)</h3>
    <div class="field">
      <label>Filtrar por proyecto</label>
      <select id="reportProject">
        <option value="">Todos los proyectos</option>
        ${state.projects.map(p=>`<option value="${p.id}" ${projectId===p.id?'selected':''}>${p.name}</option>`).join('')}
      </select>
    </div>
    <pre class="report">${text}</pre>
    <div class="row">
      <button class="btn" id="copyBtn">Copiar reporte</button>
    </div>
  </div>`;
  $('#reportProject').onchange = renderReporte;
  $('#copyBtn').onclick = ()=>{
    const t = buildReportText($('#reportProject').value);
    navigator.clipboard.writeText(t).then(()=>toast('Reporte copiado')).catch(()=>toast('No se pudo copiar'));
  };
}

/* ---------------- NAV / INIT ---------------- */
function render(){
  setHeaderSub();
  if(state.tab==='hoy') renderHoy();
  else if(state.tab==='trabajadores') renderTrabajadores();
  else if(state.tab==='semana') renderSemana();
  else if(state.tab==='audio') renderAudio();
  else if(state.tab==='reporte') renderReporte();
}
$$('.tabbar button').forEach(b=>{
  b.onclick = ()=>{
    $$('.tabbar button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    state.tab = b.dataset.tab;
    render();
  };
});
function shiftDate(days){
  const d = new Date(state.date+'T00:00:00');
  d.setDate(d.getDate()+days);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
async function goToDate(iso){
  state.date = iso;
  $('#datePicker').value = iso;
  await loadLog(state.date);
  render();
}
$('#prevDay').onclick = ()=> goToDate(shiftDate(-1));
$('#nextDay').onclick = ()=> goToDate(shiftDate(1));
$('#datePicker').onchange = (e)=> goToDate(e.target.value);

(async function init(){
  $('#datePicker').value = state.date;
  await loadWorkers();
  await loadProjects();
  await loadLog(state.date);
  render();
})();
</script>
