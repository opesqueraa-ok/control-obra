<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Visualizador · Bitácora de Obra</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --ink:#1C1F26; --steel:#3D5A80; --safety:#FF6A13; --paper:#F3F1EA; --card:#FFFFFF;
    --line:#DEDAD0; --ok:#2E7D32; --bad:#C0392B; --warn:#B8860B; --muted:#767267;
  }
  *{box-sizing:border-box; touch-action:manipulation;}
  body{margin:0; font-family:'Inter',system-ui,-apple-system,sans-serif; background:var(--paper); color:var(--ink);}
  h1,h2,h3{font-family:'Barlow Condensed', system-ui, sans-serif; font-weight:700;}
  header{background:var(--ink); color:#fff; padding:14px 16px; position:sticky; top:0; z-index:20;}
  header .row{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  header h1{font-size:20px; margin:0;}
  .pill{background:#2E7D32; color:#fff; font-size:11px; padding:3px 9px; border-radius:20px; font-weight:600;}
  main{padding:14px; max-width:820px; margin:0 auto;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:14px;}
  .card h3{margin:0 0 10px; font-size:19px;}
  .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .btn{background:var(--safety); color:#fff; border:none; border-radius:7px; padding:9px 14px; font-weight:600; font-size:14px; cursor:pointer; font-family:inherit;}
  .btn.ghost{background:transparent; color:var(--steel); border:1px solid var(--steel); padding:7px 11px;}
  input[type=date], input[type=month], select{
    border:1px solid var(--line); border-radius:6px; padding:7px 8px; font-size:16px; font-family:inherit; background:#fff;
  }
  .field label{font-size:11.5px; color:var(--muted); display:block; margin-bottom:3px;}
  .empty{color:var(--muted); font-size:13.5px; padding:6px 0;}
  .calendar{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-top:10px;}
  .cal-head{font-size:11px; text-align:center; color:var(--muted); font-weight:700;}
  .cal-day{
    aspect-ratio:1; border-radius:7px; display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:600; cursor:pointer; border:1px solid var(--line); background:#FAFAF7; color:var(--muted);
  }
  .cal-day.blank{visibility:hidden;}
  .cal-day.ok{background:#E3F1E3; color:var(--ok); border-color:#C7E4C7;}
  .cal-day.warn{background:#FCEDCB; color:var(--warn); border-color:#F3DFA3;}
  .cal-day.ot{background:#E4EEF9; color:var(--steel); border-color:#C9DDF0;}
  .cal-day.selected{outline:2px solid var(--ink); outline-offset:1px;}
  .legend{display:flex; gap:12px; flex-wrap:wrap; margin-top:10px; font-size:11.5px; color:var(--muted);}
  .legend span{display:inline-flex; align-items:center; gap:5px;}
  .dot{width:10px; height:10px; border-radius:50%; display:inline-block;}
  #dayDetail{margin-top:12px; border-top:1px dashed var(--line); padding-top:12px;}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th,td{text-align:left; padding:7px 6px; border-bottom:1px solid var(--line);}
  th{color:var(--muted); font-weight:700; font-size:11.5px; text-transform:uppercase;}
  .chartwrap{background:#fff; border-radius:8px; padding:8px; margin-top:10px;}
  .summary3{display:flex; gap:8px; margin-top:10px;}
  .summary3 .box{flex:1; text-align:center; background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px 4px;}
  .summary3 .num{font-family:'Barlow Condensed'; font-size:24px; font-weight:700;}
  .summary3 .lbl{font-size:10px; color:var(--muted);}
  .spin{color:var(--muted); font-size:13px; padding:10px 0;}
</style>
</head>
<body>

<header>
  <div class="row">
    <h1>👁️ Visualizador de Obra</h1>
    <span class="pill">Solo lectura</span>
  </div>
</header>

<main>

  <div class="card">
    <h3>Calendario de asistencia</h3>
    <div class="row">
      <button class="btn ghost" id="prevMonth">◀</button>
      <input type="month" id="monthPicker">
      <button class="btn ghost" id="nextMonth">▶</button>
    </div>
    <div class="calendar" id="calendarGrid"></div>
    <div class="legend">
      <span><span class="dot" style="background:#E3F1E3;border:1px solid #C7E4C7;"></span> Todos presentes, sin extra</span>
      <span><span class="dot" style="background:#FCEDCB;border:1px solid #F3DFA3;"></span> Hubo ausencias</span>
      <span><span class="dot" style="background:#E4EEF9;border:1px solid #C9DDF0;"></span> Hubo horas extra</span>
      <span><span class="dot" style="background:#FAFAF7;border:1px solid #DEDAD0;"></span> Sin datos</span>
    </div>
    <div id="dayDetail"></div>
  </div>

  <div class="card">
    <h3>Resumen por rango de fechas</h3>
    <div class="row">
      <div class="field"><label>Desde</label><input type="date" id="rangeStart"></div>
      <div class="field"><label>Hasta</label><input type="date" id="rangeEnd"></div>
      <button class="btn" id="viewRangeBtn" style="margin-top:16px;">Ver</button>
    </div>
    <div id="rangeResult"></div>
  </div>

</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getFirestore, collection, doc, getDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAbzvkJY9ik3lklVXJGoWBtBn9_f7SaS8I",
  authDomain: "control-obra-a0496.firebaseapp.com",
  projectId: "control-obra-a0496",
  storageBucket: "control-obra-a0496.firebasestorage.app",
  messagingSenderId: "336205273799",
  appId: "1:336205273799:web:307236773fb332700fbce2"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const DIAS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const LUNCH_HOURS = 1;

function workedHours(entrada, salida){
  if(!entrada || !salida) return 0;
  const [h1,m1] = entrada.split(':').map(Number);
  const [h2,m2] = salida.split(':').map(Number);
  let diff = (h2*60+m2) - (h1*60+m1);
  if(diff < 0) diff += 24*60;
  return +(diff/60).toFixed(2);
}
function overtimeHours(salida, real){
  if(!salida || !real) return 0;
  const [h1,m1] = salida.split(':').map(Number);
  const [h2,m2] = real.split(':').map(Number);
  const diff = (h2*60+m2) - (h1*60+m1);
  return diff > 0 ? +(diff/60).toFixed(2) : 0;
}
function totalOvertime(l){
  const base = overtimeHours(l.salida, l.salidaReal);
  const lunch = l.tookLunch === false ? LUNCH_HOURS : 0;
  return +(base + lunch).toFixed(2);
}

let workers = [], projects = [];
async function loadRoster(){
  try{
    const [wSnap, pSnap] = await Promise.all([getDocs(collection(db,'workers')), getDocs(collection(db,'projects'))]);
    workers = wSnap.docs.map(d=>({id:d.id, ...d.data()}));
    projects = pSnap.docs.map(d=>({id:d.id, ...d.data()}));
  }catch(e){ console.error(e); }
}

/* ---------- Calendario mensual ---------- */
let calMonth = new Date(); calMonth.setDate(1);
let monthCache = {}; // iso -> log data | null

function monthInputValue(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; }

async function loadMonth(){
  $('#calendarGrid').innerHTML = '<p class="spin">Cargando mes...</p>';
  $('#dayDetail').innerHTML = '';
  const year = calMonth.getFullYear(), month = calMonth.getMonth();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  monthCache = {};
  const promises = [];
  for(let day=1; day<=daysInMonth; day++){
    const iso = `${year}-${pad(month+1)}-${pad(day)}`;
    promises.push(
      getDoc(doc(db,'logs',iso)).then(snap=>{ monthCache[iso] = snap.exists() ? snap.data() : null; })
      .catch(()=>{ monthCache[iso] = null; })
    );
  }
  await Promise.all(promises);
  renderCalendar();
}

function dayStatus(log){
  if(!log) return 'none';
  const entries = Object.values(log.workers||{});
  if(entries.length===0) return 'none';
  const anyAbsent = entries.some(l=>!l.present);
  if(anyAbsent) return 'warn';
  const anyOT = entries.some(l=>totalOvertime(l) > 0);
  if(anyOT) return 'ot';
  return 'ok';
}

function renderCalendar(){
  const year = calMonth.getFullYear(), month = calMonth.getMonth();
  $('#monthPicker').value = monthInputValue(calMonth);
  const firstDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  let html = ['D','L','M','M','J','V','S'].map(d=>`<div class="cal-head">${d}</div>`).join('');
  for(let i=0;i<firstDow;i++) html += `<div class="cal-day blank"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const iso = `${year}-${pad(month+1)}-${pad(day)}`;
    const status = dayStatus(monthCache[iso]);
    html += `<div class="cal-day ${status}" data-iso="${iso}">${day}</div>`;
  }
  $('#calendarGrid').innerHTML = html;
  document.querySelectorAll('.cal-day[data-iso]').forEach(el=>{
    el.onclick = ()=>{
      document.querySelectorAll('.cal-day').forEach(x=>x.classList.remove('selected'));
      el.classList.add('selected');
      renderDayDetail(el.dataset.iso);
    };
  });
}

function renderDayDetail(iso){
  const log = monthCache[iso];
  const d = new Date(iso+'T00:00:00');
  const title = `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`;
  if(!log || Object.keys(log.workers||{}).length===0){
    $('#dayDetail').innerHTML = `<h3 style="font-size:16px;">${title}</h3><p class="empty">Sin datos registrados este día.</p>`;
    return;
  }
  let rows = '';
  workers.forEach(w=>{
    const l = log.workers[w.id];
    if(!l) return;
    const ot = totalOvertime(l);
    const proj = l.projectId ? (projects.find(p=>p.id===l.projectId)?.name || '') : '';
    rows += `<tr>
      <td>${w.name}</td>
      <td>${l.present ? '✅' : '❌'}</td>
      <td>${l.present ? (l.entrada||'--')+' a '+(l.salida||'--') : '—'}</td>
      <td>${ot>0 ? '+'+ot+'h' : '—'}</td>
      <td>${proj||'—'}</td>
    </tr>`;
  });
  const acts = (log.activities||[]).map(a=>`<li>${a.time} — ${a.text}${a.workerName?` (${a.workerName})`:''}</li>`).join('') || '<li class="empty">Sin actividades</li>';
  $('#dayDetail').innerHTML = `
    <h3 style="font-size:16px;">${title}</h3>
    <table>
      <thead><tr><th>Trabajador</th><th>Asist.</th><th>Horario</th><th>Extra</th><th>Proyecto</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="5" class="empty">Sin registros</td></tr>'}</tbody>
    </table>
    <p style="font-size:12px; color:var(--muted); margin:10px 0 4px;">Actividades:</p>
    <ul style="margin:0; padding-left:18px; font-size:13px;">${acts}</ul>
  `;
}

$('#prevMonth').onclick = ()=>{ calMonth.setMonth(calMonth.getMonth()-1); loadMonth(); };
$('#nextMonth').onclick = ()=>{ calMonth.setMonth(calMonth.getMonth()+1); loadMonth(); };
$('#monthPicker').onchange = (e)=>{
  const [y,m] = e.target.value.split('-').map(Number);
  calMonth = new Date(y, m-1, 1);
  loadMonth();
};

/* ---------- Resumen por rango ---------- */
let rangeChart = null;
async function loadRange(){
  const start = $('#rangeStart').value, end = $('#rangeEnd').value;
  if(!start || !end || start > end){ $('#rangeResult').innerHTML = '<p class="empty">Elige un rango válido.</p>'; return; }
  $('#rangeResult').innerHTML = '<p class="spin">Cargando rango...</p>';

  const dates = [];
  let d = new Date(start+'T00:00:00');
  const endD = new Date(end+'T00:00:00');
  while(d <= endD){
    dates.push(`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`);
    d.setDate(d.getDate()+1);
  }

  const logs = await Promise.all(dates.map(iso =>
    getDoc(doc(db,'logs',iso)).then(s=>s.exists()?s.data():null).catch(()=>null)
  ));

  const perWorker = {}; // id -> {presentDays, absentDays, horas, extra}
  workers.forEach(w=> perWorker[w.id] = {name:w.name, presentDays:0, absentDays:0, horas:0, extra:0});
  const dayLabels = [], dayHoras = [], dayExtra = [];

  dates.forEach((iso, idx)=>{
    const log = logs[idx];
    const dd = new Date(iso+'T00:00:00');
    dayLabels.push(`${dd.getDate()}/${dd.getMonth()+1}`);
    let hSum=0, eSum=0;
    if(log){
      Object.entries(log.workers||{}).forEach(([wid,l])=>{
        if(!perWorker[wid]) perWorker[wid] = {name:'(eliminado)', presentDays:0, absentDays:0, horas:0, extra:0};
        if(l.present){
          perWorker[wid].presentDays++;
          const h = workedHours(l.entrada,l.salida);
          const e = totalOvertime(l);
          perWorker[wid].horas += h;
          perWorker[wid].extra += e;
          hSum += h; eSum += e;
        } else {
          perWorker[wid].absentDays++;
        }
      });
    }
    dayHoras.push(+hSum.toFixed(2));
    dayExtra.push(+eSum.toFixed(2));
  });

  let rows = Object.values(perWorker)
    .filter(w=>w.presentDays>0 || w.absentDays>0)
    .sort((a,b)=>b.horas-a.horas)
    .map(w=>`<tr>
      <td>${w.name}</td>
      <td>${w.presentDays}</td>
      <td>${w.absentDays}</td>
      <td>${w.horas.toFixed(1)}h</td>
      <td>${w.extra.toFixed(1)}h</td>
    </tr>`).join('');

  const totalHoras = Object.values(perWorker).reduce((s,w)=>s+w.horas,0);
  const totalExtra = Object.values(perWorker).reduce((s,w)=>s+w.extra,0);

  $('#rangeResult').innerHTML = `
    <div class="summary3">
      <div class="box"><div class="num">${totalHoras.toFixed(0)}</div><div class="lbl">horas trabajadas</div></div>
      <div class="box"><div class="num">${totalExtra.toFixed(0)}</div><div class="lbl">horas extra</div></div>
      <div class="box"><div class="num">${dates.length}</div><div class="lbl">días en el rango</div></div>
    </div>
    <div class="chartwrap"><canvas id="rangeChart" height="200"></canvas></div>
    <table style="margin-top:12px;">
      <thead><tr><th>Trabajador</th><th>Días pres.</th><th>Días aus.</th><th>Horas</th><th>Extra</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="5" class="empty">Sin datos en este rango</td></tr>'}</tbody>
    </table>
  `;

  if(rangeChart) rangeChart.destroy();
  rangeChart = new Chart($('#rangeChart'), {
    type:'bar',
    data:{ labels: dayLabels, datasets:[
      {label:'Horas normales', data:dayHoras, backgroundColor:'#3D5A80'},
      {label:'Horas extra', data:dayExtra, backgroundColor:'#FF6A13'}
    ]},
    options:{ responsive:true, plugins:{legend:{position:'bottom',labels:{font:{size:11}}}}, scales:{x:{stacked:true},y:{stacked:true}} }
  });
}
$('#viewRangeBtn').onclick = loadRange;

/* ---------- Init ---------- */
(async function init(){
  await loadRoster();
  $('#monthPicker').value = monthInputValue(calMonth);
  await loadMonth();
  const today = new Date();
  const weekAgo = new Date(); weekAgo.setDate(today.getDate()-6);
  $('#rangeEnd').value = `${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
  $('#rangeStart').value = `${weekAgo.getFullYear()}-${pad(weekAgo.getMonth()+1)}-${pad(weekAgo.getDate())}`;
  loadRange();
})();
</script>
</body>
</html>
